# Hunters-MacBook-Air
# Symlinked to local.conf by ./deploy based on machine_id().
#
# The base font_family (Cascadia Mono NF) is the Linux boxes' AUR-packaged
# name and isn't installed here — this Mac only has the Homebrew cask
# font-caskaydia-cove-nerd-font, which registers under a different family
# name. Matches Zed's terminal font on this same machine.
font_family      CaskaydiaCove Nerd Font Mono
bold_font        CaskaydiaCove Nerd Font Mono Bold
italic_font      CaskaydiaCove Nerd Font Mono Italic
bold_italic_font CaskaydiaCove Nerd Font Mono Bold Italic
font_size 14
